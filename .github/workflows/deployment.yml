name: Deployment

on:
  push:
    branches:
      - master
      - develop
      - fix/**
      - feature/**

  workflow_dispatch:

jobs:
  validate:
    name: Validate App
    uses: ./.github/workflows/validate.yml

  deployment:
    name: Deploy App
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Get Code
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - name: Setup Yarn
        run: corepack enable
      - name: Setup Modules
        run: yarn install --immutable
      - name: Build
        run: yarn build
      # - name: Restore Build
      #   uses: actions/download-artifact@v7
      #   with:
      #     name: app-build
      #     path: dist
      - name: Outputs Contents
        run: ls
      - name: Deployment
        run: echo "Deployment Successful!"
