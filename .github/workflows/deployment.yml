name: Deployment

on:
  push:
  workflow_dispatch:

jobs:
  deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v7
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - name: Install Modules
        run: yarn install --immutable
      - name: Install Playwright
        run: npx playwright install --with-deps
      - name: Checking for Linting Issues
        run: yarn lint
      - name: Unit Tests
        run: yarn test:unit
      - name: E2E Tests
        run: yarn test:e2e
        env:
          CI: true
      - name: Building
        run: yarn build
      - name: Status
        run: echo "Success!"
