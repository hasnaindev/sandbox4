name: Deployment

on:
  push:
    branches:
      - master
      - develop
      - fix/**
      - feature/**

  workflow_dispatch:

jobs:
  validate:
    name: Validate App
    uses: ./.github/workflows/validate.yml

  deployment:
    name: Deploy App
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
          enable-corepack: true
      - name: Get Code
        uses: actions/checkout@v7
      - name: Restore Build
        uses: actions/cache/restore@v6
        with:
          fail-on-cache-miss: true
          key: ${{ needs.validate.outputs.build-cache-key }}
          path: dist
      - name: Restore Modules
        uses: actions/cache/restore@v6
        with:
          fail-on-cache-miss: true
          key: ${{ needs.validate.outputs.modules-cache-key }}
          path: node_modules
      - name: Outputs Contents
        run: ls
      - name: Deployment
        run: echo "Deployment Successful!"
