name: Deployment

on:
  push:
    branches:
      - feature/**
      - fix/**
      - develop
      - master

  workflow_dispatch:

jobs:
  validate:
    name: Validate App
    uses: ./.github/workflows/calls/validate.yml

  deployment:
    name: Deploy App
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Get Code
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - name: Setup Yarn
        run: corepack enable
      - name: Setup Modules
        run: yarn install --immutable
      - name: Build
        run: yarn build
      - name: Deployment
        run: echo "Deployment Successful!"
