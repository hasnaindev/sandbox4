name: Deployment

on:
  push:
    branches:
      - feature/**
      - fix/**
      - develop
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build App
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      id-token: write

  validate:
    name: Validate App
    needs: build
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read
      id-token: write

  deployment:
    name: Deploy App
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Get Code
        uses: actions/checkout@v7
      - name: Restore Build
        uses: actions/cache/restore@v6
        with:
          path: dist
          key: ${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
      - name: Deployment
        run: echo "Deployment Successful!"
