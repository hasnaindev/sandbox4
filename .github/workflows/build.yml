name: Build

on: workflow_call

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - name: Setup Yarn
        run: corepack enable
      - name: Setup Modules
        run: yarn install --immutable
      - name: Build
        run: yarn build
      - name: Cache Build
        uses: actions/cache/save@v6
        with:
          path: dist
          key: ${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
