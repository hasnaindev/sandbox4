name: Validate

on:
  workflow_call:
    inputs:
      cache-key:
        description: 'Cache key used to restore the dist folder'
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - name: Setup Yarn
        run: corepack enable
      - name: Setup Modules
        run: yarn install --immutable
      - name: Test Lint
        run: yarn lint
      - name: Unit Test
        run: yarn test:unit
      - name: Build
        run: yarn build
      - name: Setup Playwright
        run: npx playwright install --with-deps
      - name: E2E Test
        run: yarn test:e2e
        env:
          CI: true
      - name: Upload E2E Trace
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 1
